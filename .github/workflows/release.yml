name: Release

# Every merge to main bumps the manifest version and publishes a release.
# The bump is patch unless the merged PR carries a "major" or "minor" label.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Bump and release
    runs-on: ubuntu-latest
    # Pushes made with GITHUB_TOKEN don't trigger workflows, but guard anyway.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Determine bump from PR labels
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          labels=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq '[.[0].labels[]?.name] | join(",")')
          echo "PR labels: ${labels:-<none>}"
          case ",${labels}," in
            *,major,*) bump=major ;;
            *,minor,*) bump=minor ;;
            *) bump=patch ;;
          esac
          echo "part=${bump}" >> "$GITHUB_OUTPUT"

      - name: Bump manifest version
        id: version
        run: echo "version=$(python3 .github/scripts/bump_version.py '${{ steps.bump.outputs.part }}')" >> "$GITHUB_OUTPUT"

      - name: Commit, tag and push
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v${VERSION}"
          git tag "v${VERSION}"
          git push origin HEAD:main "v${VERSION}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v${VERSION}" --title "v${VERSION}" --generate-notes --verify-tag
